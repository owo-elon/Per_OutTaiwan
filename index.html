<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050816">
    <meta name="description" content="Per OutTaiwan 多功能工具集合與任務控制台">
    <title>Per OutTaiwan｜多功能工具控制台</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('darkMode');
        const isDark = savedTheme === null
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : savedTheme === 'true';
        document.documentElement.classList.toggle('dark', isDark);
      } catch (error) {
        console.warn('Unable to restore the saved color theme.', error);
      }
    </script>
</head>

<body>
    <div id="homeApp"></div>
    <script type="module" src="/src/scripts/home/home.ts"></script>
</body>

</html>
