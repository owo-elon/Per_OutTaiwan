<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050816">
    <meta name="description" content="可自訂獎項的隨機選擇轉盤">
    <title>命運轉盤｜Per OutTaiwan</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('darkMode');
        const isDark = savedTheme === null
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : savedTheme === 'true';
        document.documentElement.classList.toggle('dark', isDark);
      } catch (error) {
        console.warn('Unable to restore the saved color theme.', error);
      }
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="../../scripts/turntable/turntable.ts"></script>
</body>
</html>
